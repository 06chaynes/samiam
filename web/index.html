<!doctype html>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>samiam</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 3rem auto; padding: 0 1rem; }
  form { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1.5rem; }
  label { display: flex; justify-content: space-between; align-items: center; }
  label input { width: 5rem; }
  [name=text], button { grid-column: 1 / -1; }
  p { font-size: 1.5rem; min-height: 2em; }
  audio { width: 100%; }
</style>
<form novalidate>
  <label>pitch <input name="pitch" type="number" step="5"></label>
  <label>speed <input name="speed" type="number" step="0.1"></label>
  <input name="text" value="I am Sam, Sam I am. Now hands off my green eggs and ham!">
  <button>Say it</button>
</form>
<p></p>
<audio controls></audio>
<script type="module">
  import init, { Voice, phonemes } from "./samiam.js";

  await init();
  const form = document.forms[0];
  const audio = document.querySelector("audio");
  const fields = form.querySelectorAll("label input");
  const voice = new Voice();
  for (const input of fields) input.value = voice[input.name];

  form.onsubmit = event => {
    event.preventDefault();
    for (const input of fields) voice[input.name] = Number(input.value);
    document.querySelector("p").textContent = phonemes(form.text.value);
    URL.revokeObjectURL(audio.src);
    audio.src = URL.createObjectURL(new Blob([voice.wav(form.text.value)], { type: "audio/wav" }));
    audio.play();
  };
</script>
